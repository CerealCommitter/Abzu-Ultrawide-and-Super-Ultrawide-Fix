; Abzu Ultrawide & Super-Ultrawide Fix settings.
; You normally don't need to edit this file: the settings window that opens when the game
; starts writes it for you. Hold Shift while the game starts to reopen that window.
[AbzuFix]
; Show the settings window every time the game starts (1) or skip it (0).
ShowSettingsAtLaunch=1

; Resolution the game runs at: "native" (your monitor's current resolution) or e.g. 5120x1440.
; Written into the game's own settings at every launch, so it can't fall back to another size.
Resolution=native

; Picture shape. 0 = fill the whole screen. A narrower shape plays centred with black bars at
; the sides, still fullscreen at your resolution. Examples: 21:9, 64:27, 16:9, 2.37
AspectRatio=0

; 1 = keep the 16:9 vertical framing on wider screens (ultrawide / super-ultrawide). 0 = off.
Enabled=1

; 1 = write AbzuFix.log next to this file (for troubleshooting).
Log=0
