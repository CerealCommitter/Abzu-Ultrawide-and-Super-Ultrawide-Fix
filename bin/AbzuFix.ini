; Abzu Screen Resolution Fix settings
[AbzuFix]
; 1 = keep the 16:9 vertical framing on wider screens (ultrawide / super-ultrawide). 0 = off.
Enabled=1

; Picture shape. 0 = fill the whole screen (default).
; Set a narrower shape to play in that shape, centred, with black bars at the sides,
; while the game stays fullscreen at your native resolution. Examples:
;   AspectRatio=21:9     AspectRatio=64:27     AspectRatio=16:9     AspectRatio=2.37
AspectRatio=0

; 1 = write AbzuFix.log next to this file (for troubleshooting).
Log=0
